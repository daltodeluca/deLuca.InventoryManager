<div style="display: flex; height: 100vh; font-family: sans-serif;">
  
  <nav style="width: 250px; background-color: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">
    
    <div>
      <h2 style="margin-top: 0;">Inventory App</h2>
      
      <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
        <li>
          <a routerLink="/categorias" style="color: white; text-decoration: none;">📁 Categorias</a>
        </li>
        <li>
          <a routerLink="/subcategorias" style="color: white; text-decoration: none;">📂 Subcategorias</a>
        </li>
        <li>
          <a routerLink="/itens" style="color: white; text-decoration: none;">📦 Itens</a>
        </li>
      </ul>
    </div>

    <div style="border-top: 1px solid #444; padding-top: 20px;">
      
      <a *ngIf="!estaLogado" 
         routerLink="/login" 
         style="display: block; text-align: center; background: #3498db; color: white; text-decoration: none; padding: 10px; border-radius: 4px;">
        🔑 Entrar no Sistema
      </a>

      <button *ngIf="estaLogado" 
              (click)="logout()" 
              style="width: 100%; background: #c0392b; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
        🚪 Sair (Logout)
      </button>

    </div>
  </nav>

  <main style="flex: 1; padding: 30px; background-color: #f8f9fa;">
    <router-outlet></router-outlet> 
  </main>

</div>
