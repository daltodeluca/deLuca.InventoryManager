<div class="d-flex" style="min-height: 100vh;">

  <nav class="bg-dark text-white p-3 d-flex flex-column justify-content-between" style="width: 240px; min-height: 100vh;">
    <div>
      <h5 class="fw-bold mb-4">📦 Inventory App</h5>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a routerLink="/categorias" routerLinkActive="active"
             class="nav-link text-white-50 px-2 py-2 rounded">
            📁 Categorias
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/subcategorias" routerLinkActive="active"
             class="nav-link text-white-50 px-2 py-2 rounded">
            📂 Subcategorias
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/itens" routerLinkActive="active"
             class="nav-link text-white-50 px-2 py-2 rounded">
            📦 Itens
          </a>
        </li>
      </ul>
    </div>

    <div class="border-top border-secondary pt-3">
      <a *ngIf="!estaLogado" routerLink="/login"
         class="btn btn-primary w-100">
        🔑 Entrar no Sistema
      </a>
      <button *ngIf="estaLogado" (click)="logout()"
              class="btn btn-danger w-100">
        🚪 Sair (Logout)
      </button>
    </div>
  </nav>

  <main class="flex-grow-1 p-4 bg-light">
    <router-outlet></router-outlet>
  </main>

</div>
