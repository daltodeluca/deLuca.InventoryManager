<div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: white;">
  <h3>Gerenciamento de Categorias</h3>
  <p>Status: <strong>{{ statusMessage }}</strong></p>

  <div style="background-color: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h4>Nova Categoria</h4>
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="text" placeholder="Nome (Ex: Energia)" 
             [(ngModel)]="novaCategoria.nome" 
             style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1;">
             
             <input type="text" 
             placeholder="Prefixo (Ex: ENG-)" 
             [(ngModel)]="novaCategoria.prefixo" 
             maxlength="4"
             style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100px;"
             [style.border-color]="novaCategoria.prefixo.length < 4 ? 'orange' : '#ccc'">
      
      <button (click)="salvarCategoria()" 
              [disabled]="isSaving || novaCategoria.prefixo.length < 4 || !novaCategoria.nome" 
              style="padding: 8px 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer;"
              [style.opacity]="(isSaving || novaCategoria.prefixo.length < 4) ? 0.5 : 1">
        {{ isSaving ? 'Salvando...' : 'Adicionar' }}
      </button>
      
      <small *ngIf="novaCategoria.prefixo.length > 0 && novaCategoria.prefixo.length < 4" style="color: orange; display: block; margin-top: 5px;">
        O prefixo deve ter 4 caracteres (ex: CAT-).
      </small>
    </div>
  </div>

  <button (click)="loadCategorias()" [disabled]="isLoading" style="padding: 10px; cursor: pointer; margin-bottom: 15px;">
    {{ isLoading ? 'Buscando...' : 'Atualizar Lista' }}
  </button>

  <ul *ngIf="categorias.length > 0" style="list-style: none; padding: 0;">
    <li *ngFor="let cat of categorias" 
        style="padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
      
      <span>
        <strong>{{ cat.nome }}</strong> 
        <small style="color: gray; margin-left: 10px;">[{{ cat.prefixo }}]</small>
      </span>

      <button (click)="excluirCategoria(cat.id)" 
              style="background: none; border: none; cursor: pointer; color: #e74c3c; font-size: 1.2rem;" 
              title="Excluir Categoria">
        🗑️
      </button>
    </li>
  </ul>

  <p *ngIf="categorias.length === 0 && !isLoading" style="color: gray;">Nenhuma categoria encontrada.</p>
</div>
