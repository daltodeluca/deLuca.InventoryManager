<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">Gerenciamento de Subcategorias</h5>
  </div>
  <div class="card-body">

    @if (statusMessage) {
      <div class="alert alert-info py-2">{{ statusMessage }}</div>
    }

    <div class="card mb-3 border-primary">
      <div class="card-body bg-primary-subtle">
        <h6 class="card-title fw-semibold">Nova Subcategoria</h6>
        <div class="row g-2 align-items-center">
          <div class="col">
            <input type="text" class="form-control" placeholder="Nome da Subcategoria"
                   [(ngModel)]="novaSub.nome">
          </div>
          <div class="col">
            <select class="form-select" [(ngModel)]="novaSub.categoriaId">
              <option [value]="0" disabled>Selecione a Categoria</option>
              <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nome }}</option>
            </select>
          </div>
          <div class="col-auto">
            <button class="btn btn-primary"
                    (click)="salvar()"
                    [disabled]="isSaving || novaSub.categoriaId === 0 || !novaSub.nome">
              {{ isSaving ? 'Gravando...' : 'Adicionar' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    @if (subcategorias.length === 0) {
      <p class="text-muted text-center py-3">Nenhuma subcategoria encontrada.</p>
    } @else {
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          @for (sub of subcategorias; track sub.id) {
            <tr>
              <td><strong>{{ sub.nome }}</strong></td>
              <td><span class="badge bg-primary">{{ sub.categoriaNome }}</span></td>
              <td class="text-end">
                <button class="btn btn-outline-danger btn-sm"
                        (click)="excluir(sub.id)"
                        title="Excluir">
                  🗑️
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }

  </div>
</div>
